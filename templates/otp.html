<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OTP Verification | SecureVote 2.0</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 420px;
            background: white;
            padding: 40px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12);
            text-align: center;
        }

        .icon {
            width: 70px;
            height: 70px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: #dbeafe;
            font-size: 32px;
        }

        h1 {
            margin-top: 25px;
            color: #0f172a;
            font-size: 28px;
        }

        .description {
            color: #64748b;
            line-height: 1.6;
            margin-top: 12px;
        }

        .otp-input {
            width: 100%;
            padding: 15px;
            margin-top: 25px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 8px;
            outline: none;
        }

        .otp-input:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .timer {
            margin-top: 18px;
            font-size: 15px;
            color: #64748b;
        }

        #countdown {
            color: #2563eb;
            font-weight: bold;
            font-size: 17px;
        }

        .expired {
            color: #dc2626 !important;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #2563eb;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="icon">
            🔐
        </div>

        <h1>
            Verify Your Identity
        </h1>

        <p class="description">
            A 6-digit verification code has been sent
            to your registered mobile number.
        </p>

        <form action="/verify-otp" method="POST">

            <input
                class="otp-input"
                type="text"
                name="otp"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                placeholder="••••••"
                required
                autocomplete="one-time-code"
            >

            <button type="submit" id="verifyBtn">
                Verify OTP →
            </button>

        </form>

        <div class="timer">
            OTP expires in:
            <span id="countdown">01:00</span>
        </div>

        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

<script>
    let timeLeft = 60;

    const countdown = document.getElementById("countdown");
    const verifyBtn = document.getElementById("verifyBtn");

    const timer = setInterval(function () {

        timeLeft--;

        countdown.textContent =
            "00:" + String(timeLeft).padStart(2, "0");

        if (timeLeft <= 0) {
            clearInterval(timer);

            countdown.textContent = "Expired";
            countdown.classList.add("expired");

            if (verifyBtn) {
                verifyBtn.disabled = true;
            }
        }

    }, 1000);
</script>

</body>

</html>
