<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Secure Digital Voting Platform</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 400px;
            margin: 100px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
        }

        h2 {
            margin-top: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 90%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🗳️ Secure Digital Voting Platform</h1>

        <p>Welcome to the Secure Digital Voting Platform</p>

        <h2>Voter Login</h2>

        <form action="/verify" method="POST">

            <label for="voter_id">Enter Voter ID</label>

            <input
                type="text"
                id="voter_id"
                name="voter_id"
                placeholder="Enter your Voter ID"
                required
            >

            <br>

            <button type="submit">Continue</button>

        </form>

    </div>

</body>
</html>
